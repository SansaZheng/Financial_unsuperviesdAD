[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-unsupervised-ad"
version = "0.1.0"
description = "Classic and 2026 financial anomaly detectors with auditable label-blind benchmarks"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "pandas>=2.2,<3", "scipy>=1.10,<2", "scikit-learn==1.7.2", "torch>=2.0", "joblib>=1.3", "threadpoolctl>=3"]

[project.optional-dependencies]
report = ["matplotlib==3.9.3"]
test = ["pytest>=8"]
modern2026 = ["pythresh==1.1.1"]
zero2026 = ["numpy>=2,<3", "scipy>=1.15,<2", "torch>=2.6", "torch-geometric==2.6.1"]

[project.scripts]
finad = "finad.__main__:main"

[tool.setuptools.packages.find]
include = ["finad*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
