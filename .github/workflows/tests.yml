name: Unsupervised AD tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[report,test,modern2026]'
      # Evaluation-only packages for the modern metric suite; see requirements-metrics-2026.txt.
      - run: python -m pip install 'statsmodels>=0.14' && python -m pip install --no-deps TSB-AD==1.5 PATE==0.1.1
      - run: python -m pytest -q
